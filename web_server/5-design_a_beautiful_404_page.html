<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h1 {
            font-size: 8rem;
            margin: 0;
            color: #e94560;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.3);
        }
        h2 {
            font-size: 1.8rem;
            margin: 10px 0;
            font-weight: 400;
        }
        p {
            color: #a2a8d3;
            max-width: 500px;
            margin: 15px 20px 30px;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            background-color: #e94560;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #ff2e63;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Ceci n'est pas une page</h2>
    <p>Looks like you drifted off course. The page you are looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Home</a>
</body>
</html>
